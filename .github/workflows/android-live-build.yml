name: Pixbar Android Live Build

on:
  push:
    branches:
      - cmp-rewrite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixbar-android-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify signed Android APK
    runs-on: ubuntu-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXBAR_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure and validate release signing
        run: |
          set -euo pipefail
          test -n "${RELEASE_PROPERTIES_BASE64}" || { echo "PIXBAR_LOCAL_PROPERTIES_BASE64 is missing." >&2; exit 1; }
          test -n "${RELEASE_KEYSTORE_BASE64}" || { echo "PIXBAR_RELEASE_KEYSTORE_BASE64 is missing." >&2; exit 1; }
          keystore_path="${RUNNER_TEMP}/pixbar-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|PIXBAR_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nPIXBAR_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          store_password="$(sed -n 's/^PIXBAR_RELEASE_STORE_PASSWORD=//p' local.properties)"
          key_alias="$(sed -n 's/^PIXBAR_RELEASE_KEY_ALIAS=//p' local.properties)"
          key_password="$(sed -n 's/^PIXBAR_RELEASE_KEY_PASSWORD=//p' local.properties)"
          [[ -n "${store_password}" && -n "${key_alias}" && -n "${key_password}" ]] || {
            echo "Android release signing properties are incomplete." >&2
            exit 1
          }

          keytool -list -keystore "${keystore_path}" -storepass "${store_password}" -alias "${key_alias}" >/dev/null || {
            echo "PIXBAR_RELEASE_STORE_PASSWORD or PIXBAR_RELEASE_KEY_ALIAS does not match the supplied release keystore." >&2
            exit 1
          }

          if keytool -exportcert -keystore "${keystore_path}" -storepass "${store_password}" -keypass "${key_password}" -alias "${key_alias}" -rfc >/dev/null 2>&1; then
            echo "Release keystore and key password validated."
          elif keytool -exportcert -keystore "${keystore_path}" -storepass "${store_password}" -keypass "${store_password}" -alias "${key_alias}" -rfc >/dev/null 2>&1; then
            echo "Release key is protected with the store password; normalizing the local release property."
            sed -i "s/^PIXBAR_RELEASE_KEY_PASSWORD=.*/PIXBAR_RELEASE_KEY_PASSWORD=${store_password}/" local.properties
          else
            echo "PIXBAR_RELEASE_KEY_PASSWORD does not unlock alias ${key_alias} in the supplied release keystore. The keystore itself is valid, but the key password secret is mismatched." >&2
            exit 1
          fi

      - name: Clean build state
        run: ./gradlew --stop || true

      - name: Build full signed release
        run: ./gradlew :androidApp:clean :androidApp:assembleFullRelease --stacktrace --no-build-cache

      - name: Rename signed APKs to com.movie.pixbar
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "No APKs were produced." >&2; exit 1; }
          for apk in "${apks[@]}"; do
            filename="$(basename "${apk}")"
            if [[ "${filename}" != com.movie.pixbar* ]]; then
              abi="${filename#full-release-}"
              abi="${abi%.apk}"
              mv "${apk}" "androidApp/build/outputs/apk/full/release/com.movie.pixbar-${abi}.apk"
            fi
          done

      - name: Verify signed APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/com.movie.pixbar*.apk)
          (( ${#apks[@]} > 0 )) || { echo "No renamed signed APKs found." >&2; exit 1; }
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner}"
          for apk in "${apks[@]}"; do
            "${apksigner}" verify --verbose "${apk}"
            echo "Verified signed APK: ${apk}"
            ls -lh "${apk}"
          done

      - name: Upload live-build APKs
        uses: actions/upload-artifact@v7
        with:
          name: pixbar-live-${{ github.sha }}
          path: androidApp/build/outputs/apk/full/release/com.movie.pixbar*.apk
          if-no-files-found: error
