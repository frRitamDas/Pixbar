name: Build Pixbar Android Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, create a draft, or publish the Android release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: publish
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pixbar-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.mode }} release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXBAR_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_REF_TYPE}" == "branch" ]] || { echo "Releases must run from a branch." >&2; exit 1; }
          [[ "${RELEASE_BRANCH}" == "${DEFAULT_BRANCH}" || "${RELEASE_BRANCH}" == "cmp-rewrite" ]] || { echo "Releases must run from ${DEFAULT_BRANCH} or cmp-rewrite." >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" && { echo "Tag ${RELEASE_TAG} already exists." >&2; exit 1; } || true
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then echo "Release ${RELEASE_TAG} already exists." >&2; exit 1; fi
          if [[ "${RELEASE_MODE}" != "dry-run" && ( -z "${RELEASE_PROPERTIES_BASE64}" || -z "${RELEASE_KEYSTORE_BASE64}" ) ]]; then echo "Required Android release secrets are missing." >&2; exit 1; fi
      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh --from "${PREVIOUS_BUMP}" --to "${CURRENT_BUMP}" --repository "${GITHUB_REPOSITORY}" --exclude "${EXCLUDE_COMMITS}" > release-notes.md
          test -s release-notes.md
      - name: Upload release notes
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  android:
    name: Build Pixbar Android APKs
    if: inputs.mode != 'dry-run'
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXBAR_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure and validate release signing
        run: |
          set -euo pipefail
          keystore_path="${RUNNER_TEMP}/pixbar-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          test -s "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|PIXBAR_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nPIXBAR_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties

          store_password="$(sed -n 's/^PIXBAR_RELEASE_STORE_PASSWORD=//p' local.properties)"
          key_alias="$(sed -n 's/^PIXBAR_RELEASE_KEY_ALIAS=//p' local.properties)"
          key_password="$(sed -n 's/^PIXBAR_RELEASE_KEY_PASSWORD=//p' local.properties)"
          [[ -n "${store_password}" && -n "${key_alias}" && -n "${key_password}" ]] || { echo "Android release signing properties are incomplete." >&2; exit 1; }
          keytool -list -keystore "${keystore_path}" -storepass "${store_password}" -alias "${key_alias}" >/dev/null || { echo "Store password or alias does not match the release keystore." >&2; exit 1; }

          cat > "${RUNNER_TEMP}/ValidatePrivateKey.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          public final class ValidatePrivateKey {
              public static void main(String[] args) throws Exception {
                  if (args.length != 3) throw new IllegalArgumentException("usage: <keystore> <alias> <password>");
                  KeyStore ks = KeyStore.getInstance(KeyStore.getDefaultType());
                  try (FileInputStream in = new FileInputStream(args[0])) { ks.load(in, args[2].toCharArray()); }
                  Key key = ks.getKey(args[1], args[2].toCharArray());
                  if (!(key instanceof java.security.PrivateKey)) throw new IllegalStateException("Private key could not be unlocked");
              }
          }
          JAVA
          javac "${RUNNER_TEMP}/ValidatePrivateKey.java"
          if java -cp "${RUNNER_TEMP}" ValidatePrivateKey "${keystore_path}" "${key_alias}" "${key_password}" >/dev/null 2>&1; then
            echo "Release private key validated."
          elif java -cp "${RUNNER_TEMP}" ValidatePrivateKey "${keystore_path}" "${key_alias}" "${store_password}" >/dev/null 2>&1; then
            echo "Release key uses store password; normalizing local property."
            python3 - "${store_password}" <<'PY'
          from pathlib import Path
          import sys
          p = Path("local.properties")
          lines = p.read_text().splitlines()
          password = sys.argv[1]
          out = ["PIXBAR_RELEASE_KEY_PASSWORD=" + password if line.startswith("PIXBAR_RELEASE_KEY_PASSWORD=") else line for line in lines]
          p.write_text("\n".join(out) + "\n")
          PY
          else
            echo "PIXBAR_RELEASE_KEY_PASSWORD cannot unlock the release private key." >&2
            exit 1
          fi
      - name: Build full release APKs
        run: ./gradlew :androidApp:clean :androidApp:assembleFullRelease --stacktrace --no-build-cache
      - name: Rename signed APK outputs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "Android release build completed without APK files." >&2; exit 1; }
          for apk in "${apks[@]}"; do
            filename="$(basename "${apk}")"
            if [[ "${filename}" != com.movie.pixbar* ]]; then
              abi="${filename#full-release-}"
              abi="${abi%.apk}"
              mv "${apk}" "androidApp/build/outputs/apk/full/release/com.movie.pixbar-${abi}.apk"
            fi
          done
      - name: Verify signed APKs
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(androidApp/build/outputs/apk/full/release/com.movie.pixbar*.apk)
          (( ${#apks[@]} > 0 )) || { echo "No signed Pixbar APK files were produced." >&2; exit 1; }
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${apksigner}"
          for apk in "${apks[@]}"; do
            "${apksigner}" verify --verbose "${apk}"
            echo "Verified signed Pixbar APK: ${apk}"
          done
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pixbar-${{ needs.prepare.outputs.version }}-android-full-release
          path: androidApp/build/outputs/apk/full/release/com.movie.pixbar*.apk
          if-no-files-found: error

  release:
    name: Publish Pixbar Android ${{ inputs.mode }} release
    if: inputs.mode != 'dry-run'
    needs: [prepare, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: pixbar-${{ needs.prepare.outputs.version }}-android-full-release
          path: release-assets
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-assets
      - name: Verify release packages
        run: |
          set -euo pipefail
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f -name 'com.movie.pixbar*.apk' -print | sort)
          (( ${#release_files[@]} > 0 )) || { echo "No Android APK packages were produced." >&2; exit 1; }
          printf 'Release APK: %s\n' "${release_files[@]}"
      - name: Create GitHub release
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f -name 'com.movie.pixbar*.apk' -print | sort)
          args=("${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_BRANCH}" --title "Pixbar ${RELEASE_VERSION}" --notes-file release-assets/release-notes.md)
          [[ "${RELEASE_MODE}" == "draft" ]] && args+=(--draft)
          gh release create "${args[@]}" "${release_files[@]}"

  store:
    name: Update Pixbar sideload source
    if: inputs.mode == 'publish'
    needs: [prepare, release]
    permissions:
      contents: write
    uses: ./.github/workflows/update-store-source.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
