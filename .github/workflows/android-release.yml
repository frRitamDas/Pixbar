name: Build Pixbar Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: publish
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pixbar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.mode }} release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXBAR_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          [[ "${RELEASE_REF_TYPE}" == "branch" ]] || { echo "Releases must run from a branch." >&2; exit 1; }
          [[ "${RELEASE_BRANCH}" == "${DEFAULT_BRANCH}" ]] || { echo "Releases must run from default branch ${DEFAULT_BRANCH}." >&2; exit 1; }
          git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" && { echo "Tag ${RELEASE_TAG} already exists." >&2; exit 1; } || true
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then echo "Release ${RELEASE_TAG} already exists." >&2; exit 1; fi
          if [[ "${RELEASE_MODE}" != "dry-run" && ( -z "${RELEASE_PROPERTIES_BASE64}" || -z "${RELEASE_KEYSTORE_BASE64}" ) ]]; then echo "Required Android release secrets are missing." >&2; exit 1; fi
      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
        run: |
          ./scripts/generate-release-notes.sh --from "${PREVIOUS_BUMP}" --to "${CURRENT_BUMP}" --repository "${GITHUB_REPOSITORY}" --exclude "${EXCLUDE_COMMITS}" > release-notes.md
          test -s release-notes.md
      - name: Upload release notes
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  android:
    name: Build Pixbar Android APKs
    if: inputs.mode != 'dry-run'
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.PIXBAR_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Configure release properties
        run: |
          keystore_path="${RUNNER_TEMP}/pixbar-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          printf '%s' "${RELEASE_PROPERTIES_BASE64}" | base64 --decode > local.properties
          sed -i -E '/^[[:space:]]*(sdk\.dir|PIXBAR_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          printf '\nPIXBAR_RELEASE_STORE_FILE=%s\n' "${keystore_path}" >> local.properties
      - name: Build full release APKs
        run: ./gradlew :androidApp:assembleFullRelease --stacktrace
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pixbar-${{ needs.prepare.outputs.version }}-android-full-release
          path: androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

  ios:
    name: Build Pixbar iOS IPA
    if: inputs.mode != 'dry-run'
    needs: prepare
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      GRADLE_OPTS: -Dfile.encoding=UTF-8
      KOTLIN_DAEMON_JVMARGS: -Xmx2048M
      PIXBAR_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
      PIXBAR_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
      RELEASE_PROPERTIES_BASE64: ${{ secrets.PIXBAR_LOCAL_PROPERTIES_BASE64 }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Prepare iOS dependencies
        run: ./scripts/prepare-ios-dependencies.sh
      - name: Build unsigned full IPA
        run: ./scripts/build-ios-ipa.sh "${{ needs.prepare.outputs.version }}"
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: pixbar-${{ needs.prepare.outputs.version }}-ios-full-release
          path: build/ios-ipa/*-full-release.ipa
          if-no-files-found: error

  release:
    name: Publish Pixbar ${{ inputs.mode }} release
    if: inputs.mode != 'dry-run'
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-assets
      - name: Create GitHub release
        run: |
          mapfile -t release_files < <(find release-assets -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipa' \) -print | sort)
          (( ${#release_files[@]} > 0 )) || { echo "No release packages were produced." >&2; exit 1; }
          args=("${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_BRANCH}" --title "Pixbar ${RELEASE_VERSION}" --notes-file release-assets/release-notes.md)
          [[ "${RELEASE_MODE}" == "draft" ]] && args+=(--draft)
          gh release create "${args[@]}" "${release_files[@]}"

  store:
    name: Update Pixbar sideload source
    if: inputs.mode == 'publish'
    needs: [prepare, release]
    permissions:
      contents: write
    uses: ./.github/workflows/update-store-source.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
